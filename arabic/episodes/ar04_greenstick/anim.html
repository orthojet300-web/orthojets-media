<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;src:url(../../fonts/Cairo.ttf);font-weight:200 1000;}
@font-face{font-family:Mont;src:url(../../fonts/Montserrat.ttf);font-weight:100 900;}
html,body{margin:0;padding:0;background:#E3F0F8;}
svg{display:block}
</style></head>
<body>
<svg id="v" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const NAVY="#223F61", SKY="#78AFD8", SKYD="#4E8BBF", SKYL="#CFE5F5", WHITE="#FFFFFF",
 BONE="#F4EAD3", BONED="#E2CFA6", CANAL="#EFDDB8", CORAL="#EC7068", GREEN="#5FBF94", SKIN="#F3D2B8", PHY="#8FC0E6";
let TL=null;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const eout=x=>{x=clamp(x);return 1-Math.pow(1-x,3);};
const P=(t,a,b)=>ease((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
let ctx2=document.createElement('canvas').getContext('2d');
function tw(s,size,w=700,fam='Mont'){ctx2.font=`${w} ${size}px ${fam}`;return ctx2.measureText(s).width;}

// ---------- shared UI ----------
function pill(x,y,text,o,{bg=NAVY,fg=WHITE,size=32,w=700,anchor='middle'}={}){
  if(o<=0)return '';
  const W=tw(text,size,w)+44,H=size+26;
  let x0=anchor==='middle'?x-W/2:anchor==='start'?x:x-W;
  const s=lerp(.85,1,eout(o));
  return `<g opacity="${clamp(o)}" transform="translate(${x0+W/2},${y}) scale(${s}) translate(${-W/2},${-H/2})">
   <rect width="${W}" height="${H}" rx="${H/2}" fill="${bg}"/>
   <text x="${W/2}" y="${H/2+size*0.36}" text-anchor="middle" font-family="Mont" font-weight="${w}" font-size="${size}" fill="${fg}">${text}</text></g>`;
}
function callout(tx,ty,lx,ly,text,o,opt={}){
  if(o<=0)return '';
  const p=eout(o*1.4);
  const ex=lerp(tx,lx,p),ey=lerp(ty,ly,p);
  return `<g opacity="${clamp(o*2)}"><line x1="${tx}" y1="${ty}" x2="${ex}" y2="${ey}" stroke="${opt.bg||NAVY}" stroke-width="4"/>
   <circle cx="${tx}" cy="${ty}" r="10" fill="${WHITE}" stroke="${opt.bg||NAVY}" stroke-width="5"/></g>`+pill(lx,ly,text,clamp((o-0.25)*1.6),opt);
}
function refText(s,o){ if(o<=0)return '';
  return `<text x="540" y="1735" text-anchor="middle" font-family="Mont" font-weight="600" font-size="28" fill="${NAVY}" opacity="${0.75*clamp(o)}">${s}</text>`;}
function bg(){
  return `<defs><linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9E2F2"/><stop offset="1" stop-color="#F3F8FC"/></linearGradient>
  <pattern id="dots" width="34" height="30" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="4" fill="${BONED}"/><circle cx="25" cy="22" r="3" fill="${BONED}"/></pattern>
  <pattern id="cols" width="22" height="20" patternUnits="userSpaceOnUse"><ellipse cx="11" cy="10" rx="8" ry="3.2" fill="${SKYD}" opacity=".55"/></pattern>
  <radialGradient id="glow"><stop offset="0" stop-color="${SKY}" stop-opacity=".55"/><stop offset="1" stop-color="${SKY}" stop-opacity="0"/></radialGradient>
  <radialGradient id="cglow"><stop offset="0" stop-color="${CORAL}" stop-opacity=".55"/><stop offset="1" stop-color="${CORAL}" stop-opacity="0"/></radialGradient>
  </defs><rect width="1080" height="1920" fill="url(#bgg)"/>
  <circle cx="900" cy="300" r="380" fill="url(#glow)" opacity=".5"/><circle cx="120" cy="1500" r="420" fill="url(#glow)" opacity=".35"/>`;
}
function watermark(){
  return `<text x="540" y="1850" text-anchor="middle" font-family="Mont" font-weight="800" font-size="36" letter-spacing="1"><tspan fill="${NAVY}">ortho</tspan><tspan fill="${SKYD}">jets</tspan></text>`;
}


// ================= ar04: greenstick & buckle fractures (general public) =================
let ST=[];
const DRYF="#C9A273", DRYS="#7A5532", GRNF="#A6D687", GRNS="#3E7D3A", XBG="#13263B", XB="#DCE9F5", XS="#8FB0CE";
function rr(x,y,w,h,r,fill,extra=''){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" ${extra}/>`;}
const CL=i=>TL.segs[i].clauses.map(c=>c.start);

// ---------- geometry: centreline P0 (s=0) -> P1 (s=1); the part after s0 turns by atan(bend), soft kink ----------
function geo(P0,P1,bend,s0){
  const dx=P1[0]-P0[0], dy=P1[1]-P0[1], L=Math.hypot(dx,dy), u=[dx/L,dy/L], v=[u[1],-u[0]];
  const e=0.03, g=s=>0.5*((s-s0)+Math.sqrt((s-s0)*(s-s0)+e*e))-0.5*Math.sqrt(s0*s0+e*e)+0.5*s0;
  const pt=s=>{const b=bend*L*g(s);return [P0[0]+u[0]*s*L+v[0]*b, P0[1]+u[1]*s*L+v[1]*b];};
  const tan=s=>{const a=pt(s-0.002),b=pt(s+0.002);const l=Math.hypot(b[0]-a[0],b[1]-a[1]);return [(b[0]-a[0])/l,(b[1]-a[1])/l];};
  return {pt,tan,L};
}
const nrm=t=>[t[1],-t[0]];
function outline(G,hw,sa,sb,capA='round',capB='round'){
  const N=80, Lp=[], Rp=[];
  for(let i=0;i<=N;i++){const s=sa+(sb-sa)*i/N, p=G.pt(s), n=nrm(G.tan(s)), w=hw(s);
    Rp.push([p[0]+n[0]*w,p[1]+n[1]*w]); Lp.push([p[0]-n[0]*w,p[1]-n[1]*w]);}
  const f=q=>q[0].toFixed(1)+' '+q[1].toFixed(1);
  const cap=(A,B,s,dir,type)=>{const t=G.tan(s), w=hw(s);
    if(type==='round') return ' C'+f([A[0]+dir*t[0]*w*1.1,A[1]+dir*t[1]*w*1.1])+' '+f([B[0]+dir*t[0]*w*1.1,B[1]+dir*t[1]*w*1.1])+' '+f(B);
    let o=''; const k=7; for(let j=1;j<k;j++){const q=j/k, z=(j%2?1:-1)*w*0.25; o+=' L'+f([A[0]+(B[0]-A[0])*q+t[0]*z, A[1]+(B[1]-A[1])*q+t[1]*z]);} return o+' L'+f(B);};
  let d='M'+f(Lp[0]); for(let i=1;i<=N;i++) d+=' L'+f(Lp[i]);
  d+=cap(Lp[N],Rp[N],sb,1,capB);
  for(let i=N;i>=0;i--) d+=' L'+f(Rp[i]);
  return d+cap(Rp[0],Lp[0],sa,-1,capA)+' Z';
}
// zig-zag crack from one edge inward (side -1 = left edge, +1 = right edge)
function crackD(G,hw,s0,side,depth){
  const p0=G.pt(s0), t=G.tan(s0), n=nrm(t), w=hw(s0), pts=[], k=5;
  for(let j=0;j<=k;j++){const q=j/k, off=w*side*(1-q*depth*2), z=(j%2?1:-1)*w*0.14*(j?1:0);
    pts.push([p0[0]+n[0]*off+t[0]*z,p0[1]+n[1]*off+t[1]*z]);}
  let len=0; for(let j=1;j<pts.length;j++) len+=Math.hypot(pts[j][0]-pts[j-1][0],pts[j][1]-pts[j-1][1]);
  return {d:'M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L'),len};
}
const convex=bend=>bend>=0?-1:1; // bend>0 turns the distal part to +v (viewer's right for a downward bone): the LEFT edge is stretched
function crackSVG(G,hw,s0,side,crack,col=CORAL,w=10){ if(crack<=0)return ''; const c=crackD(G,hw,s0,side,0.55);
  return `<path d="${c.d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${c.len}" stroke-dashoffset="${(c.len*(1-clamp(crack))).toFixed(1)}"/>`;}
// generic long bone (children: growth plates near both ends)
function longHW(hw0,flare,bulge=0,sb=.8){return s=>hw0+flare*Math.exp(-Math.pow(s/0.09,2))+flare*Math.exp(-Math.pow((1-s)/0.09,2))+bulge*Math.exp(-Math.pow((s-sb)/0.035,2));}
function bone(P0,P1,{hw,bend=0,s0=.5,crack=0,snap=0,phy=[],peri=0,fill=BONE,stroke=NAVY,sw=11,dots=true}){
  let o='';
  if(snap>0){
    const G=geo(P0,P1,0,s0), mid=G.pt(s0), ang=snap*20, gap=0.01;
    const dA=outline(G,hw,0,s0-gap,'round','jag'), dB=outline(G,hw,s0+gap,1,'jag','round');
    return `<g stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"><path d="${dA}" fill="${fill}" transform="rotate(${-ang*0.25} ${mid[0]} ${mid[1]})"/>
      <path d="${dB}" fill="${fill}" transform="translate(${snap*30} ${snap*24}) rotate(${ang} ${mid[0]} ${mid[1]})"/></g>`;
  }
  const G=geo(P0,P1,bend,s0), d=outline(G,hw,0,1);
  if(peri>0) o+=`<path d="${outline(G,s=>hw(s)+17,0.12,0.88)}" fill="${SKY}" fill-opacity="${0.45*peri}" stroke="${SKYD}" stroke-width="7" stroke-opacity="${peri}"/>`;
  o+=`<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  if(dots&&fill===BONE) o+=`<path d="${d}" fill="url(#dots)" opacity=".5"/>`;
  phy.forEach(s=>{const p=G.pt(s), n=nrm(G.tan(s)), w=hw(s)-sw*0.6;
    o+=`<line x1="${(p[0]-n[0]*w).toFixed(1)}" y1="${(p[1]-n[1]*w).toFixed(1)}" x2="${(p[0]+n[0]*w).toFixed(1)}" y2="${(p[1]+n[1]*w).toFixed(1)}" stroke="${PHY}" stroke-width="10" stroke-linecap="round"/>`;});
  o+=crackSVG(G,hw,s0,convex(bend),crack);
  return o;
}
function edgePt(P0,P1,bend,s0,hw,side){const G=geo(P0,P1,bend,s0), p=G.pt(s0), n=nrm(G.tan(s0)), w=hw(s0); return [p[0]+n[0]*w*side,p[1]+n[1]*w*side];}

// ---------- twigs ----------
function twig(P0,P1,{dry=false,bend=0,crack=0,snap=0}){
  const hw=s=>15-3*s, f=dry?DRYF:GRNF, st=dry?DRYS:GRNS;
  let o='';
  if(!dry){const G=geo(P0,P1,bend,0.5);
    [[0.14,1],[0.3,-1],[0.72,1],[0.88,-1]].forEach(([q,sd])=>{const p=G.pt(q), n=nrm(G.tan(q)), cx=p[0]+n[0]*sd*48, cy=p[1]+n[1]*sd*48, ang=Math.atan2(n[1]*sd,n[0]*sd)*180/Math.PI;
      o+=`<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="40" ry="17" transform="rotate(${ang.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})" fill="${GREEN}" stroke="${GRNS}" stroke-width="5"/>`;});}
  o+=bone(P0,P1,{hw,bend,s0:.5,snap,fill:f,stroke:st,sw:8,dots:false});
  if(!dry&&crack>0){const G=geo(P0,P1,bend,0.5); o+=crackSVG(G,hw,0.5,convex(bend),crack,CORAL,7);}
  return o;
}

// ---------- right forearm, front (palm-forward) view: radius on the thumb side = viewer's left ----------
const RP0=[522,760], RP1=[452,1392], UP0=[606,700], UP1=[560,1388], RS0=0.78;
const radHW=(bulge=0)=>s=>13+12*Math.exp(-Math.pow((s-0.02)/0.035,2))+5*Math.exp(-Math.pow((s-0.17)/0.035,2))+40*Math.pow(clamp((s-0.68)/0.31),2.2)+bulge*Math.exp(-Math.pow((s-0.87)/0.025,2));
const ulnHW=s=>lerp(16,10,s)+28*Math.exp(-Math.pow((s-0.04)/0.07,2))+8*Math.exp(-Math.pow((s-0.975)/0.03,2));
function forearm({bend=0,crack=0,bulge=0,skin=1,xray=false,carp=1}={},t=0){
  const fill=xray?XB:BONE, stroke=xray?XS:NAVY, sw=xray?5:9;
  let o='';
  if(skin>0&&!xray){
    const arm='M462 470 C444 900 410 1220 398 1400 L404 1470 L636 1470 L642 1400 C642 1200 668 900 712 460 Z';
    const palm='M398 1420 C392 1500 396 1560 410 1610 L630 1610 C640 1560 646 1500 640 1420 Z';
    const caps=[[322,1600,402,1480,58],[428,1600,424,1745,50],[484,1606,484,1765,52],[540,1604,544,1752,50],[596,1596,604,1712,44]];
    const pass=(st)=>`<path d="${arm}"${st}/><path d="${palm}"${st}/>`;
    o+=`<g opacity="${0.6*skin}"><g fill="${NAVY}" stroke="${NAVY}" stroke-width="12" stroke-linejoin="round">${pass('')}</g>`+
      caps.map(([x1,y1,x2,y2,w])=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${NAVY}" stroke-width="${w+12}" stroke-linecap="round"/>`).join('')+
      `<g fill="${SKIN}">${pass('')}</g>`+caps.map(([x1,y1,x2,y2,w])=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${SKIN}" stroke-width="${w}" stroke-linecap="round"/>`).join('')+'</g>';}
  // carpals (two rows), schematic
  [[456,1452,30,22],[508,1450,25,21],[553,1446,20,18],[588,1455,16,14],[446,1500,25,20],[490,1503,23,21],[530,1501,22,20],[570,1497,26,23]].forEach(([x,y,a,b])=>{
    o+=`<ellipse cx="${x}" cy="${y}" rx="${a}" ry="${b}" fill="${fill}" stroke="${stroke}" stroke-width="${sw*0.65}" opacity="${carp}"/>`;});
  o+=bone(UP0,UP1,{hw:ulnHW,phy:xray?[]:[0.955],fill,stroke,sw,dots:!xray});
  o+=bone(RP0,RP1,{hw:radHW(bulge),bend,s0:RS0,crack,phy:xray?[]:[0.045,0.955],fill,stroke,sw,dots:!xray});
  return o;
}
function armLabels(a){ if(a<=0)return '';
  return pill(300,900,'Radius',a,{bg:WHITE,fg:NAVY,size:28,w:800})+pill(780,900,'Ulna',a,{bg:WHITE,fg:NAVY,size:28,w:800})+
   `<g opacity="${a}"><line x1="372" y1="900" x2="470" y2="930" stroke="${NAVY}" stroke-width="4"/><line x1="730" y1="900" x2="598" y2="930" stroke="${NAVY}" stroke-width="4"/></g>`;}

// ---------- scenes ----------
function sceneHook(t){
  let o=bg();
  o+=pill(540,250,'GREENSTICK FRACTURE',1,{bg:NAVY,size:40,w:800});
  const b=0.30*P(t,0.6,2.6), cr=P(t,2.2,3.2), hw=longHW(36,40);
  o+=bone([540,690],[540,1560],{hw,bend:b,s0:.5,crack:cr,phy:[0.1,0.9]});
  const e=edgePt([540,690],[540,1560],b,.5,hw,-1), e2=edgePt([540,690],[540,1560],b,.5,hw,1);
  o+=callout(e[0],e[1],250,1040,'cracks',P(t,2.6,3.2),{bg:CORAL,size:34,w:900});
  o+=callout(e2[0],e2[1],840,1300,'bends',P(t,1.6,2.2),{bg:SKYD,size:34,w:900});
  o+=pill(540,1660,"CHILD'S BONE",P(t,0.3,0.8),{bg:WHITE,fg:NAVY,size:30,w:800});
  return o;
}
function sceneTwig(t){
  let o=bg(); const s=ST[1], c=CL(1), a=P(t,s-0.3,s+0.4);
  const snap=P(t,c[0]+0.6,c[0]+1.3), bend=0.32*P(t,c[2]-0.2,c[2]+0.5), cr=P(t,c[3],c[3]+0.7);
  o+=`<g opacity="${a}">${twig([300,800],[300,1500],{dry:true,snap})}${twig([780,800],[780,1500],{bend,crack:cr})}</g>`;
  o+=pill(300,1640,'DRY twig',a,{bg:DRYS,size:34,w:800})+pill(780,1640,'GREEN twig',a,{bg:GRNS,size:34,w:800});
  o+=pill(300,700,'snaps in two',P(t,c[0]+1.1,c[0]+1.6),{bg:CORAL,size:30,w:800});
  o+=pill(780,700,'bends · cracks on one side',P(t,c[3]+0.3,c[3]+0.8),{bg:SKYD,size:28,w:800});
  return o;
}
function sceneKid(t){ // segments 2 (child vs adult) and 3 (periosteum)
  let o=bg(); const s2=ST[2], s3=ST[3], c=CL(2), a=P(t,s2-0.3,s2+0.4);
  const mv=P(t,s3-0.2,s3+0.6), xk=lerp(310,540,mv), adultA=a*(1-mv);
  const bend=0.24*P(t,c[1],c[1]+0.8), cr=P(t,c[1]+0.4,c[1]+1.0), snap=P(t,c[1]+0.2,c[1]+0.9);
  const hwC=longHW(30,34), hwA=longHW(36,40);
  o+=`<g opacity="${a}">${bone([xk,760],[xk,1500],{hw:hwC,bend,s0:.5,crack:cr,phy:[0.1,0.9],peri:P(t,s3+0.2,s3+1.0)})}</g>`;
  o+=`<g opacity="${adultA}">${bone([780,760],[780,1500],{hw:hwA,s0:.5,snap})}</g>`;
  o+=pill(xk,1640,'CHILD',a,{bg:NAVY,size:34,w:800})+pill(780,1640,'ADULT',adultA,{bg:NAVY,size:34,w:800});
  if(t<s3){o+=pill(545,900,'more flexible',P(t,c[2],c[2]+0.4)*(1-mv),{bg:SKYD,size:30,w:800});
    o+=pill(545,975,'less mineral',P(t,c[3],c[3]+0.4)*(1-mv),{bg:SKYD,size:30,w:800});
    o+=pill(940,980,'can snap',P(t,c[1]+0.8,c[1]+1.3)*(1-mv),{bg:CORAL,size:30,w:800});}
  const e=edgePt([540,760],[540,1500],0.24,.5,s=>hwC(s)+17,1);
  o+=callout(e[0],e[1]-140,830,960,'PERIOSTEUM (thick)',P(t,s3+0.6,s3+1.3),{bg:SKYD,size:30,w:800});
  o+=callout(578,834,830,740,'Growth plates',P(t,s3+1.4,s3+1.9),{bg:PHY,fg:NAVY,size:28,w:800});
  o+=refText(t<s3?'Currey & Butler, J Bone Joint Surg Am 1975':'Bašković et al., Med Sci 2026',a);
  return o;
}
// forearm scene: segments 4 (fall), 5 (name), 6 (buckle), 7 (wrist)
const MAG=[800,1140,205];
function buckleZoom(cx,cy,R,a,t){ if(a<=0)return '';
  const s=lerp(.3,1,eout(a)), hw=s0=>70+36*Math.exp(-Math.pow((s0-0.55)/0.06,2))*P(t,ST[6]+1.0,CL(6)[2]+0.4);
  const G=geo([cx-10,cy-R-40],[cx+10,cy+R+40],0,.5);
  let o=`<defs><clipPath id="mz"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath></defs>
   <g opacity="${clamp(a*1.5)}" transform="translate(${cx},${cy}) scale(${s}) translate(${-cx},${-cy})">
   <circle cx="${cx}" cy="${cy}" r="${R}" fill="${WHITE}"/><g clip-path="url(#mz)"><path d="${outline(G,hw,0,1)}" fill="${BONE}" stroke="${NAVY}" stroke-width="12"/>
   <path d="${outline(G,hw,0,1)}" fill="url(#dots)" opacity=".5"/></g>`;
  const ap=P(t,CL(6)[1],CL(6)[1]+0.4);
  o+=`<g opacity="${ap}" stroke="${CORAL}" stroke-width="10" stroke-linecap="round" fill="none"><path d="M${cx} ${cy-R+20} V${cy-70} M${cx-18} ${cy-92} L${cx} ${cy-70} L${cx+18} ${cy-92}"/>
     <path d="M${cx} ${cy+R-20} V${cy+70} M${cx-18} ${cy+92} L${cx} ${cy+70} L${cx+18} ${cy+92}"/></g>`;
  return o+`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${SKYD}" stroke-width="12"/></g>`;
}
function gsZoom(cx,cy,R,a,bend,crack){ if(a<=0)return '';
  const s=lerp(.3,1,eout(a)), hw=()=>60, G=geo([cx-30,cy-R-60],[cx-30,cy+R+60],bend,.5), d=outline(G,hw,0,1);
  return `<defs><clipPath id="gz"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath></defs>
   <g opacity="${clamp(a*1.5)}" transform="translate(${cx},${cy}) scale(${s}) translate(${-cx},${-cy})">
   <circle cx="${cx}" cy="${cy}" r="${R}" fill="${WHITE}"/><g clip-path="url(#gz)"><path d="${d}" fill="${BONE}" stroke="${NAVY}" stroke-width="12"/>
   <path d="${d}" fill="url(#dots)" opacity=".5"/>${crackSVG(G,hw,.5,convex(bend),crack,CORAL,11)}</g>
   <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${SKYD}" stroke-width="12"/></g>`;}
function sceneArm(t){
  let o=bg(); const s4=ST[4], s5=ST[5], s6=ST[6], s7=ST[7], c4=CL(4), c7=CL(7);
  const a=P(t,s4-0.3,s4+0.4);
  const gs=1-P(t,s6-0.2,s6+0.4);                       // greenstick shown in 4-5, buckle in 6
  const crack=P(t,c4[1],c4[1]+0.8)*gs, bp=P(t,c4[2]-0.2,c4[2]+0.7), bend=0.15*bp*gs;
  const bulge=9*P(t,s6+1.0,CL(6)[2]+0.4)*(1-P(t,s7-0.3,s7+0.2));
  const zin=P(t,c4[1]-0.4,c4[1]+0.3), zout=1-P(t,s7-0.4,s7+0.3);
  const shift=-170*zin*zout;
  o+=`<g opacity="${a}" transform="translate(${shift},0) translate(540,720) scale(.82) translate(-540,-660)">${forearm({bend,crack,bulge})}`;

function row(y,txt,ap,icon,col,h=160,size=42){ if(ap<=0)return ''; const s=lerp(.9,1,eout(ap));

  const lines=Array.isArray(txt)?txt:[txt];
  const tl=lines.map((l,i)=>`<text x="270" y="${y+size*0.36+(i-(lines.length-1)/2)*size*1.15}" font-family="Mont" font-weight="800" font-size="${size}" fill="${NAVY}">${l}</text>`).join('');
  return `<g opacity="${clamp(ap)}" transform="translate(540,${y}) scale(${s}) translate(-540,${-y})"><rect x="90" y="${y-h/2}" width="900" height="${h}" rx="34" fill="${WHITE}"/>
   <g transform="translate(185,${y})"><circle r="50" fill="${col}"/>${ic}</g>${tl}</g>`;}

function sceneCTA(t){

// ---------- captions ----------
let WORDS=null;
function buildWords(){
  WORDS=[];
  for(const s of TL.segs) for(const c of s.clauses){
    const clean=c.text.replace(/[ً-ْٰـ]/g,'').replace(/[؟?.!:،,]/g,'').trim();
    const ws=clean.split(/\s+/).filter(Boolean).reduce((r,w)=>{if(r.length&&r[r.length-1]==='لا')r[r.length-1]+=' '+w;else r.push(w);return r;},[]);
    const wt=ws.map(w=>w.length+1.6), tot=wt.reduce((a,b)=>a+b,0);
    let t0=c.start+0.05; const dur=c.end-c.start-0.05;
    ws.forEach((w,i)=>{const d=dur*wt[i]/tot; WORDS.push({w,a:t0,b:t0+d}); t0+=d;});
  }
}
function caption(t){
  if(!WORDS)buildWords();
  let cur=null; for(const w of WORDS){ if(t>=w.a && t<w.b+0.25){cur=w;} }
  if(!cur) return '';
  const p=eout((t-cur.a)/0.12), s=lerp(0.8,1,p);
  return `<g transform="translate(540,445) scale(${s})" opacity="${clamp(p*1.5)}"><text x="0" y="0" text-anchor="middle" direction="rtl" font-family="Cairo" font-weight="900" font-size="104"
     fill="${WHITE}" stroke="${NAVY}" stroke-width="14" stroke-linejoin="round" paint-order="stroke">${cur.w}</text></g>`;
}

// ---------- master ----------
let SC=[], OB=[];
function buildSC(){
  ST=TL.segs.map(s=>s.start);
  OB=ST.concat([TL.segs[TL.segs.length-1].end,TL.total]);
  SC=[[0,ST[1],sceneHook],[ST[1],ST[2],sceneTwig],[ST[2],ST[4],sceneKid],[ST[4],ST[8],sceneArm],[ST[8],ST[9],sceneStat],
      [ST[9],ST[10],sceneXray],[ST[10],ST[11],sceneHeal],[ST[11],ST[12],sceneTreat],[ST[12],ST[13],sceneLesson],[ST[13],999,sceneCTA]];
}
function render(tr){
  const t=warp(tr);
  const F=0.35;
  let idx=0; for(let i=0;i<SC.length;i++){ if(t>=SC[i][0]-F) idx=i; }
  const cur=SC[idx], prev=idx>0?SC[idx-1]:null;
  let out='';
  const fa=clamp((t-(cur[0]-F))/(2*F));
  if(prev && fa<1){ out+=prev[2](t)+`<g opacity="${fa}">${cur[2](t)}</g>`; } else out+=cur[2](t);
  out+=watermark()+caption(tr);
  document.getElementById('v').innerHTML=out;
}
function warp(t){ if(!TL)return t; const NB=TL.segs.map(s=>s.start).concat([TL.segs[TL.segs.length-1].end,TL.total]);
  if(t<=NB[0]) return t*OB[0]/NB[0];
  for(let i=0;i<NB.length-1;i++){ if(t<NB[i+1]) return OB[i]+(t-NB[i])*(OB[i+1]-OB[i])/(NB[i+1]-NB[i]); }
  return OB[OB.length-1]+(t-NB[NB.length-1]); }
window.render=render;
window.setTL=x=>{TL=x;WORDS=null;buildSC();};
